<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0f1c" />
  <title>Chemical Decomposition Kinetics Modeler</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Scrollbars, <select> popups and number spinners are UA-drawn, and they paint
       from the used color-scheme, so it has to follow the theme rather than stay
       pinned dark. Declared on the root for the document widgets and on the tool
       for its own subtree; the light block below overrides both. */
    :root { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    #decomp-tool {
      color-scheme: dark;
      --bg: #0a0f1c;
      --panel: #121a2e;
      --panel-2: #1a2440;
      --border: #2a3552;
      --text: #e6ebf7;
      --muted: #8a93b5;
      --accent: #4d96ff;
      --danger: #ff6b6b;
      /* Chart.js paints on a canvas, so the two colours that exist only there get
         their own variables. They hold the literals already hard-coded in the
         chart config, which stay as the no-stylesheet fallbacks. */
      --chart-legend: #aab4d4;
      --chart-grid: rgba(255, 255, 255, .06);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    #decomp-tool *, #decomp-tool *::before, #decomp-tool *::after { box-sizing: border-box; }
    #decomp-tool header { text-align: center; margin-bottom: 18px; }
    #decomp-tool header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.2px; }
    #decomp-tool header p { margin: 0; color: var(--muted); font-size: 13px; }
    #decomp-tool .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      align-items: start;
    }
    #decomp-tool .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    #decomp-tool h2 { font-size: 14px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
    #decomp-tool h3 { font-size: 12px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
    #decomp-tool label.fld { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    #decomp-tool input[type="number"], #decomp-tool select {
      width: 100%;
      margin-top: 5px;
      padding: 8px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    #decomp-tool input[type="number"]:focus, #decomp-tool select:focus { outline: none; border-color: var(--accent); }
    #decomp-tool .temp-row { display: flex; gap: 8px; align-items: center; margin-top: 5px; }
    #decomp-tool .temp-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    #decomp-tool .temp-row input[type="number"] { width: 74px; margin-top: 0; }
    #decomp-tool .temp-row .k { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 72px; text-align: right; }
    #decomp-tool .pw-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    #decomp-tool .pw-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #decomp-tool .pw-head input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
    #decomp-tool .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: #0a0f1c;
      background: var(--c, var(--accent));
    }
    #decomp-tool .pw-k { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #decomp-tool .pw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #decomp-tool .pw-grid label { font-size: 11px; color: var(--muted); }
    #decomp-tool .pw-grid input { margin-top: 3px; padding: 6px 8px; font-size: 12px; }
    #decomp-tool .pw-off { opacity: 0.45; }
    #decomp-tool .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    #decomp-tool button {
      flex: 1;
      padding: 9px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    #decomp-tool button:hover { border-color: var(--accent); }
    #decomp-tool button.primary { background: var(--accent); border-color: var(--accent); color: #05080f; font-weight: 600; }
    #decomp-tool .chk { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 12px; cursor: pointer; }
    #decomp-tool .chk input { accent-color: var(--accent); }
    #decomp-tool .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    #decomp-tool .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    #decomp-tool .card .cl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    #decomp-tool .card .cv { font-size: 19px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    #decomp-tool .card .cs { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #decomp-tool .chart-box { position: relative; height: 380px; }
    #decomp-tool .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; background: rgba(10, 15, 28, 0.7); border-radius: 8px;
    }
    #decomp-tool .pcard {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    #decomp-tool .phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    #decomp-tool .pshare { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #decomp-tool .plist { list-style: none; margin: 0; padding: 0; }
    #decomp-tool .plist li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
    #decomp-tool .plist li:last-child { border-bottom: none; }
    #decomp-tool .plist .pc { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #decomp-tool .pnote { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    #decomp-tool .table-wrap { overflow-x: auto; max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
    #decomp-tool table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    #decomp-tool th, #decomp-tool td { padding: 7px 10px; text-align: right; white-space: nowrap; }
    #decomp-tool th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); font-weight: 600; z-index: 1; }
    #decomp-tool th:first-child, #decomp-tool td:first-child { text-align: left; }
    #decomp-tool td { border-top: 1px solid var(--border); }
    #decomp-tool tr.hl td { background: rgba(77, 150, 255, 0.10); }
    #decomp-tool tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }
    #decomp-tool .note { font-size: 12px; color: var(--muted); line-height: 1.6; max-width: 1200px; margin: 0 auto; }
    #decomp-tool .note b { color: var(--text); }
    /* ── Light theme ── the app contract: localStorage "mol3d.theme", applied as
       html[data-theme="light"], --theme-color #f6f8fa. Every rule above stays as
       written; these selectors only ever match once data-theme="light" is on <html>,
       and they outrank the dark rules they stand in for. The tool keeps its own blue
       hue, just deepened, so flipping the theme does not repaint it in the game's
       cyan. The pathway chips wear a type colour as their background, so the chip ink
       is set by whichever set is showing: dark ink on the bright dark set, light ink
       on the deepened light set. */
    html[data-theme="light"] #decomp-tool {
      color-scheme: light;
      --bg: #e8edf5;
      --panel: #ffffff;
      --panel-2: #dfe6f1;
      --border: #c3cfe0;
      --text: #1a2a40;
      --muted: #55637e;
      --accent: #0b5fce;
      --danger: #cf222e;
      --chart-legend: #3d4d68;
      --chart-grid: rgba(20, 40, 80, .13);
    }
    /* body keeps its default 8px margin, so the strip around the tool is painted by
       body, not by #decomp-tool; give the light page a background there too. */
    html[data-theme="light"] body { background: #e8edf5; }
    html[data-theme="light"] #decomp-tool .badge { color: #f6f8fa; }
    html[data-theme="light"] #decomp-tool button.primary { color: #f6f8fa; }
    html[data-theme="light"] #decomp-tool .empty { background: rgba(246, 248, 250, 0.78); }
    html[data-theme="light"] #decomp-tool tr.hl td { background: rgba(11, 95, 206, 0.10); }
    html[data-theme="light"] #decomp-tool tbody tr:hover td { background: rgba(20, 40, 80, 0.05); }
    #decomp-tool .theme-btn {
      flex: none;
      margin-top: 10px;
      padding: 6px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    @media (max-width: 940px) {
      #decomp-tool .layout { grid-template-columns: 1fr; }
      #decomp-tool .chart-box { height: 300px; }
    }
  </style>
  <script>
    /* Blocking, so the stored theme is on <html> before the body paints and the page
       never flashes dark. Reads the same key the game writes (mol3d.theme) and pushes
       it onto the two metas the browser chrome and its own widgets read. */
    (function () {
      'use strict';
      var mode = 'dark';
      try {
        var saved = localStorage.getItem('mol3d.theme');
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (e) { /* private mode: stay dark */ }
      document.documentElement.dataset.theme = mode;
      var light = mode === 'light';
      var cs = document.querySelector('meta[name="color-scheme"]');
      if (cs) cs.setAttribute('content', light ? 'light' : 'dark');
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', light ? '#f6f8fa' : '#0d1117');
    })();
  </script>
</head>
<body>
  <div id="decomp-tool">
    <header>
      <h1>🧪 Chemical Decomposition Kinetics Modeler</h1>
      <p>First-order competing-pathway degradation &middot; Arrhenius temperature dependence &middot; [A]<sub>t</sub> = [A]<sub>0</sub>&thinsp;e<sup>&minus;kt</sup></p>
      <button id="themeBtn" class="theme-btn" type="button" title="Switch colour theme">☀️ Light theme</button>
    </header>

    <div class="layout">
      <!-- Controls -->
      <section>
        <div class="panel">
          <h2>Parameters</h2>
          <label class="fld">Preset molecule
            <select id="preset"></select>
          </label>
          <label class="fld">Initial concentration C₀ (mg/L)
            <input id="c0" type="number" min="0" step="any" />
          </label>
          <label class="fld">Temperature T
            <div class="temp-row">
              <input id="temp" type="range" min="0" max="100" step="1" />
              <input id="tempNum" type="number" min="0" max="100" step="0.5" />
              <span class="k" id="tempK"></span>
            </div>
          </label>

          <h3>Degradation pathways</h3>
          <div id="pathways"></div>

          <div class="btn-row">
            <button id="resetBtn">Reset preset</button>
            <button id="csvBtn" class="primary">Export CSV</button>
          </div>
          <label class="chk"><input type="checkbox" id="logY" /> Logarithmic concentration axis</label>
        </div>
      </section>

      <!-- Results -->
      <section>
        <div class="cards" id="cards"></div>

        <div class="panel">
          <h2>Concentration vs. time <span style="text-transform:none;letter-spacing:0" id="winNote"></span></h2>
          <div class="chart-box">
            <canvas id="chart"></canvas>
            <div class="empty" id="emptyState" hidden>Enable at least one degradation pathway.</div>
          </div>
        </div>

        <div class="panel">
          <h2>Predicted breakdown products</h2>
          <div id="products"></div>
        </div>

        <div class="panel">
          <h2>Time series</h2>
          <div class="table-wrap"><table id="table"></table></div>
        </div>

        <p class="note" id="note"></p>
      </section>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const R = 8.314; // J/(mol·K)
    const TYPE_COLORS = { Hydrolysis: '#6bcb77', Oxidation: '#ffd93d', Photolysis: '#ff6bff', Thermal: '#ff9f45' };
    // The same four identities, deepened for a white plot: the dark set is too pale
    // to trace on light and too dark for its own chips to keep their ink. Selected at
    // draw time, so TYPE_COLORS above still paints the dark theme exactly as before.
    const TYPE_COLORS_LIGHT = { Hydrolysis: '#15803d', Oxidation: '#8a6100', Photolysis: '#a531bd', Thermal: '#c2410c' };
    const SUP = { '-': '\u207B', '0': '\u2070', '1': '\u00B9', '2': '\u00B2', '3': '\u00B3', '4': '\u2074', '5': '\u2075', '6': '\u2076', '7': '\u2077', '8': '\u2078', '9': '\u2079' };
    const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
    const fmtExp = x => (!isFinite(x) || x === 0) ? '0' : (() => { const e = Math.floor(Math.log10(Math.abs(x))); return (x / Math.pow(10, e)).toFixed(2) + '\u00D710' + sup(e); })();
    const concFmt = v => v === 0 ? '0' : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 0.01 ? v.toFixed(3) : fmtExp(v);
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

    // ── Presets: literature-style Arrhenius parameters (illustrative) ──
    const PRESETS = {
      aspirin: {
        name: 'Aspirin (acetylsalicylic acid) — drug',
        c0: 500,
        pathways: [
          { on: true, type: 'Hydrolysis', a: 3.6e6, ea: 73.6, products: ['Salicylic acid', 'Acetic acid'],
            note: 'Water cleaves the ester bond (C9H8O4 → C7H6O3 + CH3COOH). Accelerated by acid/base catalysis and heat.' },
          { on: true, type: 'Oxidation', a: 1.2e2, ea: 52.0, products: ['2,3-Dihydroxybenzoic acid'],
            note: 'Radical attack (\u00B7OH, dissolved O\u2082) hydroxylates the electron-rich aromatic ring.' },
        ],
      },
      atrazine: {
        name: 'Atrazine — herbicide (pollutant)',
        c0: 5,
        pathways: [
          { on: true, type: 'Hydrolysis', a: 1.3e8, ea: 85.0, products: ['Hydroxyatrazine'],
            note: 'Substitution of the chlorine on the triazine ring by OH\u207B; dominant in neutral water.' },
          { on: true, type: 'Photolysis', a: 8.0e-5, ea: 15.0, products: ['Deethylatrazine'],
            note: 'UV absorption cleaves the N-alkyl side chain; sunlit surface waters.' },
          { on: true, type: 'Oxidation', a: 3.0e2, ea: 55.0, products: ['Deisopropylatrazine'],
            note: 'Advanced oxidation (O\u2083/\u00B7OH) oxidizes the isopropyl substituent.' },
        ],
      },
      paracetamol: {
        name: 'Paracetamol (acetaminophen) — drug',
        c0: 250,
        pathways: [
          { on: true, type: 'Oxidation', a: 1.5e3, ea: 45.0, products: ['NAPQI', '1,4-Benzoquinone'],
            note: 'Oxidation of the phenol to the reactive imine NAPQI and benzoquinone; fast in chlorinated/oxygenated water.' },
          { on: true, type: 'Hydrolysis', a: 2.0e3, ea: 68.0, products: ['p-Aminophenol', 'Acetic acid'],
            note: 'Amide C\u2013N cleavage — slow at neutral pH (hydrolytically stable drug).' },
          { on: true, type: 'Photolysis', a: 1.0e-4, ea: 10.0, products: ['p-Aminophenol', 'Polymeric dimers'],
            note: 'Direct UV photolysis of the aromatic chromophore.' },
        ],
      },
      custom: {
        name: 'Custom molecule (generic)',
        c0: 100,
        pathways: [
          { on: true, type: 'Hydrolysis', a: 1.0e6, ea: 70.0, products: ['Fragment P1', 'Fragment P2'],
            note: 'Generic water-mediated bond cleavage — edit A and Ea for your compound.' },
          { on: true, type: 'Oxidation', a: 8.0e2, ea: 50.0, products: ['Oxidized fragment O1'],
            note: 'Generic radical/electron-transfer oxidation — edit A and Ea for your compound.' },
        ],
      },
    };

    // ── State ──
    const state = { key: 'aspirin', c0: 500, T: 25, pathways: [] };
    const deepcopy = p => JSON.parse(JSON.stringify(p));
    const arrhenius = (a, eaJ, Tk) => a * Math.exp(-eaJ / (R * Tk));

    // ── Element cache ──
    const $ = id => document.getElementById(id);
    const elPreset = $('preset'), elC0 = $('c0'), elTemp = $('temp'), elTempNum = $('tempNum'),
      elTempK = $('tempK'), elPathways = $('pathways'), elCards = $('cards'), elProducts = $('products'),
      elTable = $('table'), elNote = $('note'), elLogY = $('logY'), elEmpty = $('emptyState'),
      elWin = $('winNote');

    // ── Chart ──
    const chart = new Chart($('chart').getContext('2d'), {
      type: 'line',
      data: { labels: [], datasets: [] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#aab4d4', boxWidth: 14, font: { size: 11 } } },
          tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + concFmt(c.parsed.y) + ' mg/L' } },
        },
        scales: {
          x: { title: { display: true, color: '#8a93b5' }, ticks: { color: '#8a93b5', maxTicksLimit: 9 }, grid: { color: 'rgba(255,255,255,.06)' } },
          y: { title: { display: true, color: '#8a93b5', text: 'Concentration (mg/L)' }, ticks: { color: '#8a93b5' }, grid: { color: 'rgba(255,255,255,.06)' } },
        },
      },
    });

    // ── Theme ──
    const THEME_KEY = 'mol3d.theme';
    const elTheme = $('themeBtn');
    const themeMode = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';

    // The chart is painted on a canvas, so CSS variables cannot reach it through the
    // stylesheet: the palette is resolved from the live theme at draw time. Every
    // fallback is the literal the chart config above already passes on day one, so a
    // page whose stylesheet has not loaded still looks exactly like the dark theme.
    function chartPalette() {
      const light = themeMode() === 'light';
      const cs = window.getComputedStyle($('decomp-tool') || document.documentElement);
      const v = (name, fb) => { const x = cs.getPropertyValue(name); return (x && x.trim()) || fb; };
      const accent = v('--accent', light ? '#0b5fce' : '#4d96ff');
      return {
        light: light,
        tick: v('--muted', light ? '#55637e' : '#8a93b5'),
        legend: v('--chart-legend', '#aab4d4'),
        grid: v('--chart-grid', 'rgba(255,255,255,.06)'),
        accent: accent,
        reactant: v('--danger', light ? '#cf222e' : '#ff6b6b'),
        reactantFill: light ? 'rgba(207,34,46,.12)' : 'rgba(255,107,107,.12)',
        type: t => (light ? TYPE_COLORS_LIGHT : TYPE_COLORS)[t] || accent
      };
    }

    // Axis, legend and gridline colours are read once, when Chart is constructed, and
    // never re-read by render(): they have to be written back into options and the
    // chart told to redraw, or a theme flip leaves the plot wearing dark colours.
    function applyChartPalette(P) {
      chart.options.plugins.legend.labels.color = P.legend;
      ['x', 'y'].forEach(k => {
        const s = chart.options.scales[k];
        s.title.color = P.tick;
        s.ticks.color = P.tick;
        s.grid.color = P.grid;
      });
    }

    function syncThemeUI() {
      const light = themeMode() === 'light';
      elTheme.textContent = light ? '\uD83C\uDF19 Dark theme' : '\u2600\uFE0F Light theme';
      elTheme.setAttribute('aria-pressed', String(light));
      const cs = document.querySelector('meta[name="color-scheme"]');
      if (cs) cs.setAttribute('content', light ? 'light' : 'dark');
      const tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', light ? '#f6f8fa' : '#0d1117');
    }

    // Badges bake their type colour into an inline --c, so the pathway rows are
    // rebuilt as well as redrawn; their input values are read back from state.
    function repaintTheme() {
      applyChartPalette(chartPalette());
      chart.update();
      buildPathwayRows();
      render();
    }

    function setTheme(mode) {
      const m = mode === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = m;
      try { localStorage.setItem(THEME_KEY, m); } catch (e) { /* private mode */ }
      syncThemeUI();
      window.dispatchEvent(new CustomEvent('mol3d:theme', { detail: { mode: m } }));
    }

    // ── Pathway input rows (rebuilt only on preset change) ──
    function buildPathwayRows() {
      elPathways.innerHTML = '';
      const P = chartPalette();
      state.pathways.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'pw-row' + (p.on ? '' : ' pw-off');
        row.innerHTML =
          '<div class="pw-head">' +
            '<input type="checkbox" ' + (p.on ? 'checked' : '') + ' aria-label="Enable pathway">' +
            '<span class="badge" style="--c:' + P.type(p.type) + '">' + esc(p.type) + '</span>' +
            '<span class="pw-k" data-k="' + i + '"></span>' +
          '</div>' +
          '<div class="pw-grid">' +
            '<label>Pre-exponential A (s\u207B\u00B9)<input type="number" step="any" min="0" data-a="' + i + '"></label>' +
            '<label>Activation energy E\u2090 (kJ/mol)<input type="number" step="any" min="0" data-ea="' + i + '"></label>' +
          '</div>';
        elPathways.appendChild(row);
        row.querySelector('[type="checkbox"]').addEventListener('change', e => {
          state.pathways[i].on = e.target.checked;
          row.classList.toggle('pw-off', !e.target.checked);
          render();
        });
        row.querySelector('[data-a]').value = p.a;
        row.querySelector('[data-ea]').value = p.ea;
        row.querySelector('[data-a]').addEventListener('input', e => { state.pathways[i].a = parseFloat(e.target.value) || 0; render(); });
        row.querySelector('[data-ea]').addEventListener('input', e => { state.pathways[i].ea = parseFloat(e.target.value) || 0; render(); });
      });
    }

    // ── Main render ──
    function render() {
      const P = chartPalette();
      const Tk = state.T + 273.15;
      elTempK.textContent = Tk.toFixed(2) + ' K';

      const active = state.pathways
        .map(p => ({ ...p, k: p.on ? arrhenius(p.a, p.ea * 1000, Tk) : 0 }))
        .filter(p => p.k > 0);
      const kT = active.reduce((s, p) => s + p.k, 0);

      // per-row k labels
      state.pathways.forEach((p, i) => {
        const el = elPathways.querySelector('[data-k="' + i + '"]');
        if (el) el.textContent = p.on ? 'k = ' + fmtExp(arrhenius(p.a, p.ea * 1000, Tk)) + ' s\u207B\u00B9' : 'disabled';
      });

      if (!active.length || kT <= 0) {
        elEmpty.hidden = false;
        elWin.textContent = '';
        chart.data.labels = []; chart.data.datasets = []; chart.update('none');
        elCards.innerHTML = ''; elProducts.innerHTML = '<p class="pnote">No active pathways.</p>';
        elTable.innerHTML = '';
        elNote.innerHTML = defaultNote(0);
        return;
      }
      elEmpty.hidden = true;

      const thalf = Math.LN2 / kT;
      const t90 = Math.LN10 / kT;
      const c0 = state.c0;

      // time unit shared by chart + table
      let unit, fac;
      if (thalf < 120) { unit = 's'; fac = 1; }
      else if (thalf < 7200) { unit = 'min'; fac = 60; }
      else if (thalf < 172800) { unit = 'h'; fac = 3600; }
      else { unit = 'd'; fac = 86400; }
      const tDisp = s => { const v = s / fac; return v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2); };

      // cards
      elCards.innerHTML =
        card('Rate constant k(T)', fmtExp(kT) + ' s\u207B\u00B9', 'sum of ' + active.length + ' pathway' + (active.length > 1 ? 's' : '')) +
        card('Decay time t\u00BD', tDisp(thalf) + ' ' + unit, 'ln(2)/k') +
        card('90% degraded t\u2089\u2080', tDisp(t90) + ' ' + unit, 'ln(10)/k') +
        card('Model window', '5 \u00D7 t\u00BD', tDisp(5 * thalf) + ' ' + unit + ' shown');
      elWin.textContent = ' \u2014 window: 5 \u00D7 t\u00BD (' + tDisp(5 * thalf) + ' ' + unit + ')';

      // series
      const N = 240, tEnd = 5 * thalf;
      const labels = [], sA = [], sP = active.map(() => []);
      let maxDev = 0;
      for (let j = 0; j <= N; j++) {
        const t = tEnd * j / N;
        const A = c0 * Math.exp(-kT * t);
        labels.push(tDisp(t));
        sA.push(A);
        let sumP = 0;
        active.forEach((p, pi) => {
          const Pi = (p.k / kT) * c0 * (1 - Math.exp(-kT * t));
          sP[pi].push(Pi); sumP += Pi;
        });
        maxDev = Math.max(maxDev, Math.abs(A + sumP - c0));
      }

      chart.data.labels = labels;
      chart.data.datasets = [
        { label: 'Reactant [A]', data: sA, borderColor: P.reactant, backgroundColor: P.reactantFill, borderWidth: 2.5, pointRadius: 0, tension: 0.25, fill: true },
        ...active.map((p, pi) => ({
          label: p.type + ': ' + p.products[0] + (p.products.length > 1 ? ' +\u2026' : ''),
          data: sP[pi], borderColor: P.type(p.type), backgroundColor: 'transparent',
          borderWidth: 2, pointRadius: 0, tension: 0.25, borderDash: [6, 3],
        })),
      ];
      chart.options.scales.x.title.text = 'Time (' + unit + ')';
      chart.options.scales.y.type = elLogY.checked ? 'logarithmic' : 'linear';
      if (elLogY.checked) chart.options.scales.y.min = Math.max(c0 * 1e-6, 1e-6);
      else delete chart.options.scales.y.min;
      chart.update('none');

      // products section
      elProducts.innerHTML = active.map(p => {
        const share = p.k / kT;
        return '<div class="pcard">' +
          '<div class="phead"><span class="badge" style="--c:' + P.type(p.type) + '">' + esc(p.type) + '</span>' +
          '<span class="pshare">k = ' + fmtExp(p.k) + ' s\u207B\u00B9 \u00B7 yield ' + (share * 100).toFixed(1) + '%</span></div>' +
          '<ul class="plist">' + p.products.map(pr =>
            '<li><b>' + esc(pr) + '</b><span class="pc">[P]\u221E \u2248 ' + concFmt(share * c0) + ' mg/L</span></li>').join('') +
          '</ul><p class="pnote">' + esc(p.note) + '</p></div>';
      }).join('');

      // table: rows every 0.25 t½, 0..5 t½
      let html = '<thead><tr><th>Time (' + unit + ')</th><th>[A] mg/L</th>' +
        active.map(p => '<th>' + esc(p.type) + ' P (mg/L)</th>').join('') + '<th>Degraded</th></tr></thead><tbody>';
      for (let j = 0; j <= 20; j++) {
        const t = thalf * j / 4;
        const A = c0 * Math.exp(-kT * t);
        html += '<tr' + (j % 4 === 0 && j > 0 ? ' class="hl"' : '') + '><td>' + tDisp(t) + '</td><td>' + concFmt(A) + '</td>' +
          active.map(p => '<td>' + concFmt((p.k / kT) * c0 * (1 - Math.exp(-kT * t))) + '</td>').join('') +
          '<td>' + ((1 - A / c0) * 100).toFixed(1) + '%</td></tr>';
      }
      elTable.innerHTML = html + '</tbody>';

      elNote.innerHTML = defaultNote(maxDev);
    }

    function card(l, v, s) {
      return '<div class="card"><div class="cl">' + l + '</div><div class="cv">' + v + '</div><div class="cs">' + s + '</div></div>';
    }
    function defaultNote(maxDev) {
      return '<b>Model assumptions:</b> pseudo-first-order kinetics (water/O\u2082 in large excess), isothermal batch, independent competing pathways; products follow mass balance [A] + \u03A3[P] = C\u2080 (max deviation ' + maxDev.toExponential(1) + ' \u2713). Arrhenius parameters k = A\u00B7e<sup>\u2212E\u2090/RT</sup> with R = 8.314 J/(mol\u00B7K) are illustrative literature-style estimates \u2014 validate against experimental data before regulatory or dosing use.';
    }

    // ── Preset loading ──
    function loadPreset(key) {
      const p = PRESETS[key];
      state.key = key;
      state.c0 = p.c0;
      state.pathways = deepcopy(p.pathways);
      elPreset.value = key;
      elC0.value = p.c0;
      buildPathwayRows();
      render();
    }

    // ── Events ──
    Object.keys(PRESETS).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = PRESETS[k].name;
      elPreset.appendChild(o);
    });
    elPreset.addEventListener('change', () => loadPreset(elPreset.value));
    elC0.addEventListener('input', () => { state.c0 = parseFloat(elC0.value) || 0; render(); });

    function setTemp(v) {
      v = Math.min(100, Math.max(0, v));
      state.T = v;
      elTemp.value = v; elTempNum.value = v;
      render();
    }
    elTemp.addEventListener('input', () => setTemp(parseFloat(elTemp.value)));
    elTempNum.addEventListener('input', () => setTemp(parseFloat(elTempNum.value) || 0));
    elLogY.addEventListener('change', render);
    $('resetBtn').addEventListener('click', () => loadPreset(state.key));

    // The label names the mode the button switches TO. mol3d:theme covers a flip made
    // in this document; storage covers one made in another tab, where no event fires.
    elTheme.addEventListener('click', () => setTheme(themeMode() === 'light' ? 'dark' : 'light'));
    window.addEventListener('mol3d:theme', repaintTheme);
    window.addEventListener('storage', e => {
      if (e.key !== THEME_KEY) return;
      document.documentElement.dataset.theme = e.newValue === 'light' ? 'light' : 'dark';
      syncThemeUI();
      repaintTheme();
    });

    $('csvBtn').addEventListener('click', () => {
      const Tk = state.T + 273.15;
      const active = state.pathways.map(p => ({ ...p, k: p.on ? arrhenius(p.a, p.ea * 1000, Tk) : 0 })).filter(p => p.k > 0);
      const kT = active.reduce((s, p) => s + p.k, 0);
      if (kT <= 0) return;
      const thalf = Math.LN2 / kT, tEnd = 5 * thalf, c0 = state.c0;
      let csv = 'time_s,[A]_mg_L,' + active.map(p => p.type.replace(/[",]/g, '') + '_products_mg_L').join(',') + '\n';
      for (let j = 0; j <= 100; j++) {
        const t = tEnd * j / 100;
        const A = c0 * Math.exp(-kT * t);
        csv += t.toFixed(2) + ',' + A.toPrecision(6) + ',' +
          active.map(p => ((p.k / kT) * c0 * (1 - Math.exp(-kT * t))).toPrecision(6)).join(',') + '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = state.key + '-degradation-T' + Tk.toFixed(0) + 'K.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // ── Init ──
    syncThemeUI();
    applyChartPalette(chartPalette());
    setTemp(25);
    loadPreset('aspirin');
  })();
  </script>
</body>
</html>
