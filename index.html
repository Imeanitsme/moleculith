<body>
  <!-- Main Menu Overlay -->
  <div id="main-menu" class="main-menu-overlay">
    <div class="main-menu-content">
      <h1 class="game-title" data-i18n="app.name">PHÂN TỬ SỐ</h1>
      <p class="game-slogan" data-i18n="app.slogan">Từ nguyên tử đến thế giới vật chất</p>
      <div class="menu-buttons">
        <button id="btn-singleplayer" class="menu-btn primary">
          <i data-lucide="user"></i>
          <span data-i18n="menu.singleplayer">Chơi đơn</span>
        </button>
        <button id="btn-teacher" class="menu-btn">
          <i data-lucide="graduation-cap"></i>
          <span data-i18n="menu.teacher">Chế độ Giáo viên</span>
        </button>
        <button id="btn-settings" class="menu-btn">
          <i data-lucide="settings"></i>
          <span data-i18n="menu.settings">Cài đặt</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <button class="modal-close" data-close="settings-modal">&times;</button>
      <h3 data-i18n="settings.title">Cài đặt</h3>
      <div class="settings-group">
        <button id="settings-theme" class="settings-btn">
          <i data-lucide="palette"></i>
          <span data-i18n="settings.theme">Giao diện: Tối</span>
        </button>
        <button id="settings-lang" class="settings-btn">
          <i data-lucide="globe"></i>
          <span data-i18n="settings.language">Ngôn ngữ: VI</span>
        </button>
        <button id="settings-quality" class="settings-btn">
          <i data-lucide="monitor"></i>
          <span data-i18n="settings.quality">Chất lượng: Tự động</span>
        </button>
        <div class="settings-volume">
          <label data-i18n="settings.volume">Âm lượng</label>
          <input type="range" id="settings-volume-slider" min="0" max="100" value="50" />
        </div>
      </div>
      <button id="settings-back" class="modal-btn primary" data-i18n="settings.back">Quay lại</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('btn-teacher').addEventListener('click', () => {
      window.location.href = 'teacher-mode.html';
    });
  </script>
